<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leaderboard - GameWithFun</title>
  <meta name="description" content="GameWithFun online gaming leaderboard. See player rankings and game time.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f7faff;
      color: #102957;
    }

    .top {
      background: #0878f9;
      color: white;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .top h1 {
      margin: 0;
      font-size: 25px;
    }

    .top p {
      margin: 6px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: 20px auto 90px;
    }

    .login-box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(16,41,87,.08);
      margin-bottom: 18px;
      text-align: center;
    }

    .login-box h2 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    .login-box p {
      margin: 0 0 15px;
      color: #667085;
      font-size: 14px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    #loginBtn {
      background: #0878f9;
      color: white;
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 15px;
    }

    #logoutBtn {
      display: none;
      background: #eef4ff;
      color: #0878f9;
      padding: 10px 18px;
      border-radius: 10px;
      margin-top: 8px;
    }

    #userInfo {
      display: none;
      margin-top: 12px;
      font-size: 14px;
    }

    .board {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(16,41,87,.08);
    }

    .board-title {
      padding: 18px;
      font-size: 20px;
      font-weight: 800;
      border-bottom: 1px solid #edf1f7;
    }

    .player {
      display: grid;
      grid-template-columns: 55px 1fr 110px 100px;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-bottom: 1px solid #edf1f7;
    }

    .player:last-child {
      border-bottom: 0;
    }

    .rank {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
    }

    .name {
      font-weight: 700;
    }

    .games,
    .time {
      text-align: right;
      font-size: 14px;
      color: #52627a;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #667085;
    }

    @media (max-width: 600px) {
      .player {
        grid-template-columns: 42px 1fr;
      }

      .games,
      .time {
        text-align: left;
        grid-column: 2;
      }

      .games::before {
        content: "Games: ";
        font-weight: 600;
      }

      .time::before {
        content: "Time: ";
        font-weight: 600;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <h1>🏆 GameWithFun Leaderboard</h1>
    <p>Play more • Have fun • Climb the leaderboard</p>
  </header>

  <main class="container">

    <!-- LOGIN -->
    <section class="login-box">
      <h2>🎮 Join the Leaderboard</h2>

      <p id="loginText">
        Login with Google to save your game activity and appear on the leaderboard.
      </p>

      <button id="loginBtn">
        🔐 Login with Google
      </button>

      <div id="userInfo"></div>

      <button id="logoutBtn">
        Logout
      </button>
    </section>

    <!-- LEADERBOARD -->
    <section class="board">

      <div class="board-title">
        🏆 Top Players
      </div>

      <div id="leaderboardList">
        <div class="empty">
          Loading leaderboard...
        </div>
      </div>

    </section>

  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="leaderboard.js"></script>

</body>
  </html>
