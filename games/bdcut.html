<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>BD Cut 🎮🍉 | GameWithFun</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#07111c;
  font-family:Arial,sans-serif;
  color:#fff;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:600px;
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#163a52 0%,#07111c 55%,#02070c 100%);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:82px;
  padding:8px 12px;
  border-radius:14px;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.hudLabel{
  font-size:11px;
  opacity:.7;
}

.hudValue{
  margin-top:2px;
  font-size:19px;
  font-weight:800;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(7px);
}

.overlay.hidden{
  display:none;
}

.panel{
  width:min(100%,390px);
  padding:30px 22px;
  border-radius:25px;
  text-align:center;
  background:
    linear-gradient(145deg,
      rgba(17,40,56,.98),
      rgba(4,13,22,.98));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    0 20px 60px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.08);
}

.logo{
  width:92px;
  height:92px;
  margin:0 auto 14px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  background:linear-gradient(135deg,#0d7cff,#00c6ff);
  box-shadow:0 12px 35px rgba(0,140,255,.35);
}

h1{
  font-size:32px;
  margin-bottom:8px;
}

.subtitle{
  color:#b9c8d5;
  line-height:1.6;
  font-size:14px;
  margin-bottom:20px;
}

.instructions{
  text-align:left;
  padding:14px;
  margin-bottom:20px;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  color:#dce8ef;
  font-size:14px;
  line-height:1.7;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px 18px;
  margin-top:8px;
  font-size:16px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg,#0878f9,#00b8ff);
  box-shadow:0 9px 25px rgba(0,130,255,.3);
}

button:active{
  transform:scale(.97);
}

.secondary{
  background:rgba(255,255,255,.09);
  box-shadow:none;
}

.scoreBig{
  font-size:45px;
  font-weight:900;
  margin:8px 0 15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){
  .panel{
    padding:24px 18px;
  }

  h1{
    font-size:28px;
  }

  .logo{
    width:78px;
    height:78px;
    font-size:43px;
  }

  .hudBox{
    min-width:72px;
    padding:7px 8px;
  }
}
</style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <!-- HUD -->
  <div id="hud">

    <div class="hudBox">
      <div class="hudLabel">SCORE</div>
      <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">COMBO</div>
      <div class="hudValue" id="combo">0</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">❤️ LIVES</div>
      <div class="hudValue" id="lives">3</div>
    </div>

  </div>


  <!-- =========================
       START / MENU
  ========================== -->

  <div class="overlay" id="menu">

    <div class="panel">

      <div class="logo">🍉</div>

      <h1>BD Cut</h1>

      <div class="subtitle">
        Cut the fruits and make the highest score!
      </div>

      <div class="instructions">
        🍉 ফলের ওপর swipe করে কাটুন<br>
        🍎 একসাথে বেশি ফল কাটলে combo পাবেন<br>
        💣 Bomb এড়িয়ে চলুন<br>
        ❤️ আপনার 3টি life আছে<br>
        🎯 যত বেশি ফল কাটবেন, score তত বেশি
      </div>

      <button id="start">
        🎮 START GAME
      </button>

      <button id="help" class="secondary">
        📖 HOW TO PLAY
      </button>

      <button id="close" class="secondary">
        🏠 HOME
      </button>

    </div>

  </div>


  <!-- =========================
       GAME OVER
  ========================== -->

  <div class="overlay hidden" id="over">

    <div class="panel">

      <div class="logo">💥</div>

      <h1>Game Over</h1>

      <div class="subtitle">
        আপনার খেলা শেষ!
      </div>

      <div class="scoreBig">
        <span id="finalScore">0</span>
      </div>

      <div class="subtitle">
        Final Score
      </div>

      <button id="again">
        🔄 PLAY AGAIN
      </button>

      <button id="back" class="secondary">
        📖 START PAGE
      </button>

    </div>

  </div>

</div>


<script>

/* ==================================================
   BD CUT GAME
================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

let W = 600;
let H = 900;

let fruits = [];
let particles = [];
let trail = [];

let score = 0;
let combo = 0;
let lives = 3;

let running = false;
let raf = 0;

let lastTime = 0;
let spawnTimer = 0;


/* ==================================================
   RESIZE
================================================== */

function resize(){

  const rect = canvas.getBoundingClientRect();

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  W = rect.width;
  H = rect.height;

  canvas.width = Math.floor(W*dpr);
  canvas.height = Math.floor(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();


/* ==================================================
   FRUITS
================================================== */

const fruitTypes = [
  {emoji:"🍉", color:"#2ecc71"},
  {emoji:"🍎", color:"#ff3b30"},
  {emoji:"🍊", color:"#ff9500"},
  {emoji:"🍋", color:"#ffd60a"},
  {emoji:"🍓", color:"#ff375f"},
  {emoji:"🍇", color:"#af52de"},
  {emoji:"🍍", color:"#ffcc00"}
];


function createFruit(){

  const type =
    fruitTypes[
      Math.floor(Math.random()*fruitTypes.length)
    ];

  const size =
    Math.max(25,Math.min(42,W*.065));

  return {

    x:size + Math.random()*(W-size*2),

    y:H+size,

    vx:(Math.random()-.5)*5,

    vy:-(11+Math.random()*5),

    gravity:.25,

    size:size,

    emoji:type.emoji,

    color:type.color,

    rotation:Math.random()*Math.PI*2,

    rotSpeed:(Math.random()-.5)*.08,

    sliced:false

  };
}


/* ==================================================
   BOMB
================================================== */

function createBomb(){

  const size =
    Math.max(25,Math.min(40,W*.06));

  return {

    x:size + Math.random()*(W-size*2),

    y:H+size,

    vx:(Math.random()-.5)*5,

    vy:-(11+Math.random()*5),

    gravity:.25,

    size:size,

    emoji:"💣",

    rotation:0,

    rotSpeed:.05,

    bomb:true,

    sliced:false

  };
}


/* ==================================================
   SPAWN
================================================== */

function spawn(){

  const count =
    Math.random() < .35 ? 3 :
    Math.random() < .65 ? 2 : 1;

  for(let i=0;i<count;i++){

    fruits.push(createFruit());

  }

  // Small chance of bomb
  if(Math.random() < .10){

    fruits.push(createBomb());

  }
}


/* ==================================================
   PARTICLES
================================================== */

function explode(x,y,color){

  for(let i=0;i<14;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,

      life:1,

      color:color,

      size:2+Math.random()*4

    });

  }
}


/* ==================================================
   RESET
================================================== */

function reset(){

  fruits=[];
  particles=[];
  trail=[];

  score=0;
  combo=0;
  lives=3;

  spawnTimer=0;

  updateHUD();
}


/* ==================================================
   START GAME
================================================== */

function startGame(){

  /*
    Add GAME state.

    This makes:

    MENU
      ↓
    GAME
      ↓ Back
    MENU
  */

  if(!history.state || history.state.gwf !== "game"){

    history.pushState(
      {gwf:"game"},
      "",
      location.href
    );

  }

  cancelAnimationFrame(raf);

  reset();

  running=true;

  $("menu").classList.add("hidden");
  $("over").classList.add("hidden");

  lastTime=performance.now();

  raf=requestAnimationFrame(loop);
}


/* ==================================================
   GAME OVER
================================================== */

function gameOver(){

  running=false;

  cancelAnimationFrame(raf);

  $("finalScore").textContent=score;

  $("over").classList.remove("hidden");
}


/* ==================================================
   UPDATE HUD
================================================== */

function updateHUD(){

  $("score").textContent=score;

  $("combo").textContent=combo;

  $("lives").textContent=lives;

}


/* ==================================================
   DRAW
================================================== */

function draw(){

  ctx.clearRect(0,0,W,H);


  /* background */

  const gradient =
    ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#10283a");
  gradient.addColorStop(1,"#02070c");

  ctx.fillStyle=gradient;

  ctx.fillRect(0,0,W,H);


  /* stars */

  ctx.globalAlpha=.15;

  for(let i=0;i<30;i++){

    const x=(i*83)%W;
    const y=(i*137)%H;

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(x,y,1.5,0,Math.PI*2);

    ctx.fill();

  }

  ctx.globalAlpha=1;


  /* fruits */

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  for(const f of fruits){

    ctx.save();

    ctx.translate(f.x,f.y);

    ctx.rotate(f.rotation);

    ctx.font=`${f.size*2}px Arial`;

    ctx.fillText(f.emoji,0,0);

    ctx.restore();

  }


  /* particles */

  for(const p of particles){

    ctx.globalAlpha=Math.max(0,p.life);

    ctx.fillStyle=p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;


  /* blade trail */

  if(trail.length>1){

    ctx.beginPath();

    ctx.moveTo(
      trail[0].x,
      trail[0].y
    );

    for(let i=1;i<trail.length;i++){

      ctx.lineTo(
        trail[i].x,
        trail[i].y
      );

    }

    ctx.strokeStyle="rgba(255,255,255,.9)";
    ctx.lineWidth=4;
    ctx.lineCap="round";
    ctx.shadowBlur=12;
    ctx.shadowColor="#00c6ff";

    ctx.stroke();

    ctx.shadowBlur=0;

  }

}


/* ==================================================
   UPDATE
================================================== */

function update(dt){

  spawnTimer+=dt;

  if(spawnTimer>650){

    spawn();

    spawnTimer=0;

  }


  for(let i=fruits.length-1;i>=0;i--){

    const f=fruits[i];

    f.vy+=f.gravity;

    f.x+=f.vx;
    f.y+=f.vy;

    f.rotation+=f.rotSpeed;


    /* walls */

    if(f.x<f.size){

      f.x=f.size;
      f.vx=Math.abs(f.vx);

    }

    if(f.x>W-f.size){

      f.x=W-f.size;
      f.vx=-Math.abs(f.vx);

    }


    /* missed */

    if(f.y>H+f.size){

      if(!f.sliced && !f.bomb){

        lives--;

        combo=0;

        updateHUD();

        if(lives<=0){

          gameOver();

          return;

        }

      }

      fruits.splice(i,1);

    }

  }


  /* particles */

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.15;

    p.life-=.035;

    if(p.life<=0){

      particles.splice(i,1);

    }

  }


  /* trail */

  for(let i=trail.length-1;i>=0;i--){

    trail[i].life-=.08;

    if(trail[i].life<=0){

      trail.splice(i,1);

    }

  }

}


/* ==================================================
   LOOP
================================================== */

function loop(now){

  if(!running){

    draw();

    return;

  }

  const dt=Math.min(now-lastTime,40);

  lastTime=now;

  update(dt);

  draw();

  raf=requestAnimationFrame(loop);

}


/* ==================================================
   SLICE
================================================== */

function sliceAt(x,y){

  if(!running)return;

  trail.push({
    x:x,
    y:y,
    life:1
  });


  let slicedSomething=false;


  for(let i=fruits.length-1;i>=0;i--){

    const f=fruits[i];

    const dx=x-f.x;
    const dy=y-f.y;

    const distance=
      Math.sqrt(dx*dx+dy*dy);


    if(distance < f.size*1.25){

      if(f.bomb){

        explode(
          f.x,
          f.y,
          "#ff453a"
        );

        lives=0;

        updateHUD();

        gameOver();

        return;

      }


      explode(
        f.x,
        f.y,
        f.color
      );

      fruits.splice(i,1);

      score+=10;

      combo++;

      slicedSomething=true;

    }

  }


  if(!slicedSomething){

    combo=0;

  }

  updateHUD();

}


/* ==================================================
   POINTER CONTROLS
================================================== */

let pointerDown=false;

function pointerPosition(e){

  const rect=canvas.getBoundingClientRect();

  return {

    x:e.clientX-rect.left,

    y:e.clientY-rect.top

  };

}


canvas.addEventListener("pointerdown",function(e){

  pointerDown=true;

  const p=pointerPosition(e);

  sliceAt(p.x,p.y);

});


canvas.addEventListener("pointermove",function(e){

  if(!pointerDown)return;

  const p=pointerPosition(e);

  sliceAt(p.x,p.y);

});


canvas.addEventListener("pointerup",function(){

  pointerDown=false;

});


canvas.addEventListener("pointercancel",function(){

  pointerDown=false;

});


/* ==================================================
   BUTTONS
================================================== */

$("start").onclick=startGame;

$("again").onclick=startGame;


/*
  Game Over → Start Page
*/

$("back").onclick=function(){

  running=false;

  cancelAnimationFrame(raf);

  $("over").classList.add("hidden");

  $("menu").classList.remove("hidden");

};


/*
  How to Play
*/

$("help").onclick=function(){

  running=false;

  cancelAnimationFrame(raf);

  $("over").classList.add("hidden");

  $("menu").classList.remove("hidden");

};


/*
  Home button
*/

$("close").onclick=function(){

  running=false;

  cancelAnimationFrame(raf);

  window.location.href="../index.html";

};


/* ==================================================
   UNIVERSAL GAMEWITHFUN BACK SYSTEM
================================================== */

(function(){

  const HOME="../index.html";


  /*
    Initial history:

    BASE → MENU
  */

  history.replaceState(
    {gwf:"base"},
    "",
    location.href
  );

  history.pushState(
    {gwf:"menu"},
    "",
    location.href
  );


  window.addEventListener("popstate",function(){

    /*
      GAME → MENU
    */

    if(running===true){

      running=false;

      cancelAnimationFrame(raf);


      const menu=
        document.getElementById("menu");

      const over=
        document.getElementById("over");


      if(over){

        over.classList.add("hidden");

      }


      if(menu){

        menu.classList.remove("hidden");

      }


      /*
        Keep MENU in history.

        Next Back → Homepage
      */

      history.pushState(
        {gwf:"menu"},
        "",
        location.href
      );

      return;

    }


    /*
      MENU → HOMEPAGE
    */

    window.location.href=HOME;

  });

})();


/* ==================================================
   INITIAL DRAW
================================================== */

updateHUD();

draw();

</script>

</body>
</html>
