<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Racing Game</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#6fc7ff}
#game{height:100vh;position:relative;background:linear-gradient(#69c8ff 0 35%,#4f9b45 35% 100%)}
.road{position:absolute;left:18%;right:18%;top:0;bottom:0;background:#333;transform:perspective(500px);border-left:8px solid #eee;border-right:8px solid #eee}
.road:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:7px dashed #fff;opacity:.8}
.hud{position:absolute;z-index:10;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:8px}.box{background:#09284fd9;color:white;padding:12px 16px;border-radius:14px;font-weight:bold}
#player,.enemy{position:absolute;width:58px;height:100px;border-radius:16px;z-index:5;box-shadow:0 5px 15px #111}
#player{background:linear-gradient(90deg,#0878ff,#50c8ff,#0878ff);bottom:90px;left:50%;transform:translateX(-50%)}
#player:before,.enemy:before{content:"";position:absolute;left:9px;right:9px;top:14px;height:34px;background:#132d4d;border-radius:10px}
#player:after{content:"";position:absolute;left:8px;right:8px;bottom:10px;height:8px;background:#ff334f;border-radius:5px}
.enemy{top:-130px}.red{background:#e73543}.yellow{background:#ffd21f}.purple{background:#8346ee}
.controls{position:absolute;z-index:12;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 25px}
button{border:2px solid white;background:#071a33dd;color:white;border-radius:50%;width:78px;height:78px;font-size:38px;font-weight:bold}
#nitro{width:100px;border-radius:20px;background:#087cff;font-size:18px}
#start{position:absolute;inset:0;z-index:20;background:#04152dcc;display:flex;align-items:center;justify-content:center}
.panel{background:#09284f;padding:30px;border-radius:24px;text-align:center;color:#fff;border:2px solid #4bb6ff;width:min(90%,350px)}
.panel h1{font-size:36px;margin:0 0 10px}.panel button{width:auto;height:auto;border-radius:14px;padding:14px 24px;background:#1188ff;font-size:18px}
#message{position:absolute;z-index:15;top:43%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:900;color:white;text-shadow:0 3px 10px #000;display:none}
</style>
</head>
<body>
<div id="game">
<div class="road"></div>
<div class="hud"><div class="box">🏁 POS <span id="pos">1</span>/4</div><div class="box">LAP <span id="lap">1</span>/3</div><div class="box">⏱ <span id="time">0.0</span></div></div>
<div id="player"></div><div class="enemy red" id="e1"></div><div class="enemy yellow" id="e2"></div><div class="enemy purple" id="e3"></div>
<div id="message"></div>
<div class="controls"><button id="left">‹</button><button id="nitro">NITRO</button><button id="right">›</button></div>
<div id="start"><div class="panel"><h1>🏎️ Color Racing</h1><p>Use ◀ ▶ to change lanes. Avoid cars and use NITRO!</p><button id="startBtn">START RACE</button></div></div>
</div>
<script>
const lanes=[35,50,65], player=document.getElementById("player"), enemies=[e1,e2,e3];
let lane=1,running=false,last=0,time=0,score=0,nitro=false,lap=1;
function setLane(){player.style.left=lanes[lane]+"%"} function move(d){if(running){lane=Math.max(0,Math.min(2,lane+d));setLane()}}
function reset(e,i){e.style.left=lanes[Math.floor(Math.random()*3)]+"%";e.style.top=(-160-i*210-Math.random()*250)+"px"}
function hit(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return A.left<B.right-10&&A.right>B.left+10&&A.top<B.bottom-10&&A.bottom>B.top+10}
function end(text){running=false;message.textContent=text;message.style.display="block";start.style.display="flex";startBtn.textContent="PLAY AGAIN"}
function startGame(){start.style.display="none";message.style.display="none";running=true;time=0;score=0;lap=1;speed=5;enemies.forEach(reset);last=performance.now();requestAnimationFrame(loop)}
function loop(now){if(!running)return;let dt=Math.min(40,now-last);last=now;time+=dt/1000;document.getElementById("time").textContent=time.toFixed(1);
let speed=5+(nitro?5:0);
for(let i=0;i<enemies.length;i++){let e=enemies[i],y=parseFloat(e.style.top)+speed*dt/16;e.style.top=y+"px";
if(hit(player,e)){end("💥 CRASH!");return} if(y>innerHeight+120){score++;reset(e,i);if(score%7===0){lap++;document.getElementById("lap").textContent=Math.min(lap,3);if(lap>3){end("🏆 YOU WIN!");return}}}}
requestAnimationFrame(loop)}
left.onclick=()=>move(-1);right.onclick=()=>move(1);
nitro.onpointerdown=()=>nitro=true;nitro.onpointerup=()=>nitro=false;nitro.onpointerleave=()=>nitro=false;
onkeydown=e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.code==="Space")nitro=true};
onkeyup=e=>{if(e.code==="Space")nitro=false};startBtn.onclick=startGame;setLane();
</script>
</body></html>
