<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Flag Guess Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  overflow-x: hidden;

  background:
    radial-gradient(circle at 10% 20%, #ff00cc55, transparent 30%),
    radial-gradient(circle at 90% 80%, #00e5ff55, transparent 30%),
    linear-gradient(135deg, #16002e, #001d4d, #002f45);
  background-size: 200% 200%;
  animation: backgroundMove 8s ease infinite;
}

@keyframes backgroundMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.game {
  width: 100%;
  max-width: 520px;
  padding: 25px;
  text-align: center;
  border-radius: 30px;

  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(18px);

  box-shadow:
    0 0 25px #00e5ff33,
    0 20px 60px #0008;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
  text-shadow: 0 0 15px #00e5ff;
}

.subtitle {
  color: #ddd;
  margin-bottom: 25px;
}

.features {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 25px;
}

.feature {
  padding: 14px 8px;
  border-radius: 16px;
  background: linear-gradient(135deg,#ff00cc44,#00e5ff44);
  border: 1px solid #ffffff22;
  font-weight: bold;
}

.start {
  border: none;
  color: white;
  font-size: 20px;
  font-weight: bold;
  padding: 16px 45px;
  border-radius: 18px;
  cursor: pointer;

  background: linear-gradient(90deg,#00c853,#00e5ff,#7c4dff,#ff00cc);
  background-size: 300% 100%;
  animation: buttonColor 3s linear infinite;

  box-shadow: 0 0 25px #00e5ff88;
}

@keyframes buttonColor {
  0% { background-position: 0%; }
  100% { background-position: 300%; }
}

.start:hover,
.restart:hover,
.next:hover {
  transform: scale(1.04);
}

.game-area,
.game-over {
  display: none;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.stat {
  padding: 11px 5px;
  border-radius: 14px;
  background: linear-gradient(135deg,#ff00cc33,#00e5ff33);
  border: 1px solid #00e5ff77;
  font-weight: bold;
}

.flag-box {
  width: 220px;
  height: 145px;
  margin: 20px auto;
  border-radius: 18px;
  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(255,255,255,.12);
  border: 2px solid #ffffff55;
  box-shadow: 0 0 30px #00e5ff55;

  animation: flagFloat 2.5s ease-in-out infinite;
}

@keyframes flagFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.flag {
  font-size: 105px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.answer {
  border: 2px solid #00bfff;
  border-radius: 15px;
  padding: 15px 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: white;

  background: linear-gradient(135deg,#005bea,#7c4dff);
  box-shadow: 0 5px 15px #0005;
  transition: .2s;
}

.answer:nth-child(2) {
  background: linear-gradient(135deg,#ff0080,#7928ca);
}

.answer:nth-child(3) {
  background: linear-gradient(135deg,#ff6a00,#ee0979);
}

.answer:nth-child(4) {
  background: linear-gradient(135deg,#00b09b,#96c93d);
}

.answer:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 0 18px #00e5ff99;
}

.answer.correct {
  background: linear-gradient(135deg,#00c853,#64dd17) !important;
  border-color: #b2ff59;
  animation: correctPop .4s;
}

.answer.wrong {
  background: linear-gradient(135deg,#ff1744,#d50000) !important;
  border-color: #ff8a80;
  animation: shake .4s;
}

@keyframes correctPop {
  50% { transform: scale(1.08); }
}

@keyframes shake {
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

#message {
  min-height: 35px;
  margin: 18px 0 10px;
  font-size: 18px;
  font-weight: bold;
}

.next,
.restart {
  border: none;
  color: white;
  font-size: 18px;
  font-weight: bold;
  padding: 14px 30px;
  border-radius: 15px;
  cursor: pointer;
  margin: auto;

  background: linear-gradient(90deg,#2979ff,#7c4dff,#ff00cc);
  box-shadow: 0 0 20px #7c4dff88;
}

.next {
  display: none;
}

.game-over h2 {
  font-size: 34px;
  margin-bottom: 15px;
  color: #ffe600;
  text-shadow: 0 0 15px #ff6d00;
}

.final-score {
  font-size: 55px;
  font-weight: bold;
  margin: 10px 0 25px;
  color: #00e5ff;
  text-shadow: 0 0 20px #00e5ff;
}

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 20;
}

.confetti-piece {
  position: absolute;
  width: 9px;
  height: 16px;
  animation: fall 2.5s linear forwards;
}

@keyframes fall {
  from {
    transform: translateY(-30px) rotate(0deg);
    opacity: 1;
  }
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

@media(max-width:420px) {
  .game {
    padding: 18px;
  }

  h1 {
    font-size: 29px;
  }

  .flag-box {
    width: 190px;
    height: 125px;
  }

  .flag {
    font-size: 88px;
  }

  .answer {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div id="confetti"></div>

<div class="game">

  <!-- HOME -->
  <div id="startScreen">

    <h1>🌍 FLAG GUESS</h1>

    <p class="subtitle">
      Guess the country from its flag!
    </p>

    <div class="features">
      <div class="feature">🌎 50+ Countries</div>
      <div class="feature">⭐ Score System</div>
      <div class="feature">🔥 Streak Mode</div>
      <div class="feature">🔊 Sound Effects</div>
    </div>

    <button class="start" onclick="startGame()">
      ▶️ START GAME
    </button>

  </div>


  <!-- GAME -->
  <div class="game-area" id="gameArea">

    <div class="stats">
      <div class="stat">⭐ <span id="score">0</span></div>
      <div class="stat">🔥 <span id="streak">0</span></div>
      <div class="stat">⏱️ <span id="timer">15</span></div>
    </div>

    <div class="flag-box">
      <div class="flag" id="flag">🇺🇸</div>
    </div>

    <div class="question">
      Which country does this flag belong to?
    </div>

    <div class="answers" id="answers"></div>

    <div id="message"></div>

    <button class="next" id="nextButton" onclick="nextQuestion()">
      NEXT ➜
    </button>

  </div>


  <!-- GAME OVER -->
  <div class="game-over" id="gameOver">

    <h2>🏆 GAME OVER!</h2>

    <p>Final Score</p>

    <div class="final-score" id="finalScore">0</div>

    <button class="restart" onclick="startGame()">
      🔄 PLAY AGAIN
    </button>

  </div>

</div>


<script>

/* =========================
   COUNTRY LIST
   Israel intentionally excluded.
========================= */

const countries = [
["United States","🇺🇸"],
["Canada","🇨🇦"],
["Mexico","🇲🇽"],
["Brazil","🇧🇷"],
["Argentina","🇦🇷"],
["Chile","🇨🇱"],
["Colombia","🇨🇴"],
["Peru","🇵🇪"],

["United Kingdom","🇬🇧"],
["France","🇫🇷"],
["Germany","🇩🇪"],
["Italy","🇮🇹"],
["Spain","🇪🇸"],
["Portugal","🇵🇹"],
["Netherlands","🇳🇱"],
["Belgium","🇧🇪"],
["Switzerland","🇨🇭"],
["Austria","🇦🇹"],
["Ireland","🇮🇪"],
["Norway","🇳🇴"],
["Sweden","🇸🇪"],
["Denmark","🇩🇰"],
["Finland","🇫🇮"],
["Poland","🇵🇱"],
["Ukraine","🇺🇦"],
["Greece","🇬🇷"],
["Turkey","🇹🇷"],

["Saudi Arabia","🇸🇦"],
["United Arab Emirates","🇦🇪"],
["Qatar","🇶🇦"],
["Kuwait","🇰🇼"],
["Oman","🇴🇲"],
["Bahrain","🇧🇭"],
["Jordan","🇯🇴"],
["Egypt","🇪🇬"],
["Morocco","🇲🇦"],
["Algeria","🇩🇿"],

["Nigeria","🇳🇬"],
["South Africa","🇿🇦"],
["Kenya","🇰🇪"],
["Ghana","🇬🇭"],
["Ethiopia","🇪🇹"],

["India","🇮🇳"],
["Pakistan","🇵🇰"],
["Bangladesh","🇧🇩"],
["Nepal","🇳🇵"],
["China","🇨🇳"],
["Japan","🇯🇵"],
["South Korea","🇰🇷"],
["Thailand","🇹🇭"],
["Vietnam","🇻🇳"],
["Philippines","🇵🇭"],
["Indonesia","🇮🇩"],
["Malaysia","🇲🇾"],
["Singapore","🇸🇬"],

["Australia","🇦🇺"],
["New Zealand","🇳🇿"],
["Fiji","🇫🇯"]
];


let score = 0;
let streak = 0;
let time = 15;
let correctCountry;
let answered = false;
let timerInterval;


/* =========================
   SOUND EFFECTS
   Uses browser Audio API.
========================= */

let audioContext;

function sound(type) {

  try {

    if (!audioContext) {
      audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    let frequency = 500;

    if (type === "correct") frequency = 700;
    if (type === "wrong") frequency = 180;
    if (type === "click") frequency = 450;
    if (type === "time") frequency = 120;
    if (type === "gameover") frequency = 300;

    oscillator.frequency.value = frequency;

    oscillator.type =
      type === "wrong" ? "sawtooth" : "sine";

    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.25,
      audioContext.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.3
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.3
    );

  } catch(e) {}
}


/* =========================
   START GAME
========================= */

function startGame() {

  score = 0;
  streak = 0;

  document.getElementById("startScreen")
    .style.display = "none";

  document.getElementById("gameOver")
    .style.display = "none";

  document.getElementById("gameArea")
    .style.display = "block";

  sound("click");

  updateStats();

  nextQuestion();
}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

  clearInterval(timerInterval);

  answered = false;
  time = 15;

  document.getElementById("timer")
    .textContent = time;

  document.getElementById("message")
    .textContent = "";

  document.getElementById("nextButton")
    .style.display = "none";

  const randomIndex =
    Math.floor(Math.random() * countries.length);

  correctCountry =
    countries[randomIndex];

  document.getElementById("flag")
    .textContent = correctCountry[1];


  let options = [correctCountry];

  while (options.length < 4) {

    const random =
      countries[
        Math.floor(Math.random() * countries.length)
      ];

    if (!options.includes(random)) {
      options.push(random);
    }
  }

  options.sort(() => Math.random() - 0.5);


  const answers =
    document.getElementById("answers");

  answers.innerHTML = "";


  options.forEach(country => {

    const button =
      document.createElement("button");

    button.className = "answer";

    button.textContent = country[0];

    button.onclick = () => {

      sound("click");

      checkAnswer(button, country);

    };

    answers.appendChild(button);

  });


  startTimer();
}


/* =========================
   TIMER
========================= */

function startTimer() {

  timerInterval =
    setInterval(() => {

      time--;

      document.getElementById("timer")
        .textContent = time;

      if (time <= 5) {
        sound("time");
      }

      if (time <= 0) {

        clearInterval(timerInterval);

        if (!answered) {

          answered = true;
          streak = 0;

          sound("wrong");

          document.getElementById("message")
            .textContent =
            "⏰ Time's Up! Correct answer: " +
            correctCountry[0];

          disableAnswers();

          document.getElementById("nextButton")
            .style.display = "block";

          updateStats();
        }
      }

    },1000);
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(button,country) {

  if (answered) return;

  answered = true;

  clearInterval(timerInterval);


  if (country[0] === correctCountry[0]) {

    button.classList.add("correct");

    score += 10;
    streak++;

    sound("correct");

    document.getElementById("message")
      .textContent =
      "🎉 CORRECT! +10 POINTS";

    createConfetti();

  } else {

    button.classList.add("wrong");

    streak = 0;

    sound("wrong");

    document.getElementById("message")
      .textContent =
      "❌ WRONG! Correct answer: " +
      correctCountry[0];


    document.querySelectorAll(".answer")
      .forEach(btn => {

        if (
          btn.textContent ===
          correctCountry[0]
        ) {

          btn.classList.add("correct");

        }

      });
  }


  disableAnswers();

  document.getElementById("nextButton")
    .style.display = "block";

  updateStats();
}


/* =========================
   DISABLE BUTTONS
========================= */

function disableAnswers() {

  document.querySelectorAll(".answer")
    .forEach(button => {

      button.disabled = true;

    });
}


/* =========================
   STATS
========================= */

function updateStats() {

  document.getElementById("score")
    .textContent = score;

  document.getElementById("streak")
    .textContent = streak;
}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

  const container =
    document.getElementById("confetti");

  const colors = [
    "#ff1744",
    "#ffea00",
    "#00e5ff",
    "#76ff03",
    "#d500f9",
    "#ff9100"
  ];

  for (let i = 0; i < 35; i++) {

    const piece =
      document.createElement("div");

    piece.className =
      "confetti-piece";

    piece.style.left =
      Math.random() * 100 + "%";

    piece.style.background =
      colors[
        Math.floor(
          Math.random() * colors.length
        )
      ];

    piece.style.animationDelay =
      Math.random() * .5 + "s";

    container.appendChild(piece);

    setTimeout(() => {
      piece.remove();
    },3000);
  }
}


/* =========================
   GAME OVER BUTTON
========================= */

function endGame() {

  clearInterval(timerInterval);

  sound("gameover");

  document.getElementById("gameArea")
    .style.display = "none";

  document.getElementById("gameOver")
    .style.display = "block";

  document.getElementById("finalScore")
    .textContent = score;

  createConfetti();
}

</script>

</body>
</html>
