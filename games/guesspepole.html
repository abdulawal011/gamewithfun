<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Is He?</title>
<meta name="description" content="Guess famous people from their pictures in this fun 15-second quiz game.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    min-height:100vh;padding:15px;display:flex;justify-content:center;align-items:center;
    font-family:Arial,sans-serif;color:white;
    background:radial-gradient(circle at top left,#302b63,transparent 40%),
               radial-gradient(circle at bottom right,#0f766e,transparent 35%),#080b18;
}
.game-wrapper{width:100%;max-width:480px}
.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.card{
    padding:22px;border-radius:28px;background:rgba(18,23,48,.94);
    border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 70px rgba(0,0,0,.45);
    backdrop-filter:blur(18px)
}
.logo{text-align:center;font-size:55px;margin-bottom:8px}
h1{
    text-align:center;font-size:30px;margin-bottom:12px;
    background:linear-gradient(90deg,#00f5d4,#8b5cf6,#ff4ecd);
    -webkit-background-clip:text;color:transparent
}
.subtitle{color:#b7bfdc;text-align:center;font-size:14px;line-height:1.8;margin-bottom:25px}
.primary-btn,.secondary-btn{
    width:100%;padding:15px;border:none;border-radius:16px;color:white;
    font-size:16px;font-weight:bold;cursor:pointer;transition:.25s
}
.primary-btn{background:linear-gradient(135deg,#00c6ff,#7c3aed);box-shadow:0 8px 25px rgba(124,58,237,.35)}
.secondary-btn{margin-top:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.primary-btn:hover,.secondary-btn:hover{transform:translateY(-3px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:12px 5px;text-align:center;border-radius:15px;background:rgba(255,255,255,.07)}
.stat small{display:block;color:#aab3d5;font-size:11px;margin-bottom:5px}
.stat strong{font-size:20px}
.top-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.round{color:#c8d0ef;font-size:13px}
.timer{min-width:58px;padding:8px 12px;text-align:center;border-radius:12px;background:#ef4444;font-size:20px;font-weight:bold}
.question-title{text-align:center;font-size:20px;margin-bottom:16px}
.image-box{
    width:100%;height:270px;overflow:hidden;position:relative;margin-bottom:15px;
    border-radius:22px;background:#050713;border:2px solid rgba(255,255,255,.12)
}
.image-box img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.image-label{
    position:absolute;left:12px;bottom:12px;padding:7px 11px;border-radius:10px;
    background:rgba(0,0,0,.65);color:#dbeafe;font-size:11px
}
.part-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:17px}
.part-btn{
    padding:12px 5px;border:none;border-radius:13px;
    background:linear-gradient(135deg,#334155,#475569);color:white;font-weight:bold;cursor:pointer
}
.part-btn:disabled{opacity:.4;cursor:not-allowed}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer-btn{
    min-height:58px;padding:10px;border:1px solid rgba(255,255,255,.13);
    border-radius:15px;background:rgba(255,255,255,.07);color:white;font-size:14px;
    font-weight:bold;cursor:pointer;transition:.25s
}
.answer-btn:hover{background:linear-gradient(135deg,#2563eb,#7c3aed);transform:translateY(-2px)}
.answer-btn:disabled{opacity:.6;cursor:not-allowed}
.reveal{
    display:none;margin-top:18px;padding:15px;text-align:center;border-radius:18px;
    background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4)
}
.reveal img{width:145px;height:145px;object-fit:cover;border-radius:50%;border:4px solid #34d399;margin-bottom:10px}
.reveal h2{color:#6ee7b7;font-size:21px}
.result-icon{text-align:center;font-size:65px;margin-bottom:10px}
.result-title{font-size:28px;text-align:center;margin-bottom:20px}
.result-score{text-align:center;font-size:48px;font-weight:bold;color:#34d399;margin-bottom:20px}
.loading{text-align:center;color:#cbd5e1;font-size:13px;margin-top:15px}
.sound-row{display:flex;justify-content:center;margin-top:14px}
.sound-btn{
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);
    color:#dbeafe;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:bold
}
@media(max-width:380px){
    .card{padding:16px}h1{font-size:25px}.answers{grid-template-columns:1fr}.image-box{height:235px}
}
</style>
</head>

<body>
<div class="game-wrapper">

<section id="homeScreen" class="screen active">
<div class="card">
<div class="logo">🧠</div>
<h1>WHO IS HE?</h1>
<p class="subtitle">ছবির চোখ, মুখ ও অন্যান্য অংশ দেখে বিখ্যাত মানুষকে চিনুন। প্রতিটি প্রশ্নের জন্য সময় থাকবে ১৫ সেকেন্ড।</p>

<div class="stats">
<div class="stat"><small>🪙 Coins</small><strong id="homeCoins">0</strong></div>
<div class="stat"><small>🏆 Best</small><strong id="homeBest">0</strong></div>
<div class="stat"><small>⏱️ Time</small><strong>15s</strong></div>
</div>

<button class="primary-btn" onclick="startGame()">▶ গেম শুরু করুন</button>
<button class="secondary-btn" onclick="showInstructions()">ℹ️ কীভাবে খেলবেন?</button>

<div class="sound-row">
<button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔊 Sound ON</button>
</div>
<p id="loadingText" class="loading"></p>
</div>
</section>

<section id="gameScreen" class="screen">
<div class="card">
<div class="stats">
<div class="stat"><small>🪙 Coins</small><strong id="gameCoins">0</strong></div>
<div class="stat"><small>⭐ Score</small><strong id="gameScore">0</strong></div>
<div class="stat"><small>⏱️ Time</small><strong>15s</strong></div>
</div>

<div class="top-line">
<span class="round" id="roundText">প্রশ্ন ১ / ১০</span>
<span class="timer" id="timer">15</span>
</div>

<h2 class="question-title" id="questionTitle">এই মানুষটিকে চিনতে পারছেন?</h2>

<div class="image-box">
<img id="questionImage" src="" alt="মানুষের ছবি">
<div class="image-label" id="imageLabel">প্রথমে চোখের অংশ দেখানো হচ্ছে</div>
</div>

<div class="part-buttons">
<button class="part-btn" id="anotherPartBtn" onclick="showAnotherPart()">👁️ আরেকটি অঙ্গ দেখুন</button>
<button class="part-btn" onclick="showFullImage()">🖼️ সম্পূর্ণ ছবি</button>
</div>

<div class="answers" id="answers"></div>

<div class="reveal" id="revealBox">
<img id="revealImage" src="" alt="সঠিক ব্যক্তির ছবি">
<h2 id="revealName"></h2>
<button class="primary-btn" style="margin-top:15px" onclick="nextQuestion()">পরের প্রশ্ন ➜</button>
</div>

<div class="sound-row">
<button class="sound-btn" id="gameSoundToggle" onclick="toggleSound()">🔊 Sound ON</button>
</div>
</div>
</section>

<section id="resultScreen" class="screen">
<div class="card">
<div class="result-icon">🏆</div>
<h1 class="result-title">গেম শেষ!</h1>
<div class="result-score" id="finalScore">0</div>

<div class="stats">
<div class="stat"><small>⭐ Score</small><strong id="resultScore">0</strong></div>
<div class="stat"><small>🪙 Coins</small><strong id="resultCoins">0</strong></div>
<div class="stat"><small>🏆 Best</small><strong id="resultBest">0</strong></div>
</div>

<button class="primary-btn" onclick="startGame()">🔄 আবার খেলুন</button>
<button class="secondary-btn" onclick="goHome()">🏠 হোমে ফিরে যান</button>
</div>
</section>
</div>

<script>
const people=[
["লিওনেল মেসি","Lionel Messi"],["ক্রিশ্চিয়ানো রোনালদো","Cristiano Ronaldo"],["নেইমার জুনিয়র","Neymar"],
["কিলিয়ান এমবাপ্পে","Kylian Mbappé"],["আর্লিং হালান্ড","Erling Haaland"],["রোনালদিনহো","Ronaldinho"],
["ডেভিড বেকহ্যাম","David Beckham"],["জিনেদিন জিদান","Zinedine Zidane"],["মোহাম্মদ সালাহ","Mohamed Salah"],
["সার্জিও রামোস","Sergio Ramos"],["বিরাট কোহলি","Virat Kohli"],["বাবর আজম","Babar Azam"],
["মহেন্দ্র সিং ধোনি","MS Dhoni"],["রোহিত শর্মা","Rohit Sharma"],["সাকিব আল হাসান","Shakib Al Hasan"],
["মাশরাফি বিন মর্তুজা","Mashrafe Bin Mortaza"],["মোস্তাফিজুর রহমান","Mustafizur Rahman"],["এবি ডি ভিলিয়ার্স","AB de Villiers"],
["শাকিব খান","Shakib Khan"],["শাহরুখ খান","Shah Rukh Khan"],["সালমান খান","Salman Khan"],
["আমির খান","Aamir Khan"],["আলিয়া ভাট","Alia Bhatt"],["হানিয়া আমির","Hania Aamir"],
["দীপিকা পাড়ুকোন","Deepika Padukone"],["জয়া আহসান","Jaya Ahsan"],["টম ক্রুজ","Tom Cruise"],
["ডোয়াইন জনসন","Dwayne Johnson"],["জাস্টিন বিবার","Justin Bieber"],["টেইলর সুইফট","Taylor Swift"],
["মাইকেল জ্যাকসন","Michael Jackson"],["শাকিরা","Shakira"],["রিহানা","Rihanna"],
["আরিয়ানা গ্রান্ডে","Ariana Grande"],["অরিজিৎ সিং","Arijit Singh"],["তাহসান রহমান খান","Tahsan Rahman Khan"],
["ইলন মাস্ক","Elon Musk"],["বিল গেটস","Bill Gates"],["মার্ক জাকারবার্গ","Mark Zuckerberg"],
["ডোনাল্ড ট্রাম্প","Donald Trump"],["ড. মুহাম্মদ ইউনূস","Muhammad Yunus"],["শেখ মুজিবুর রহমান","Sheikh Mujibur Rahman"],
["কাজী নজরুল ইসলাম","Kazi Nazrul Islam"],["আলবার্ট আইনস্টাইন","Albert Einstein"],["জ্যাকি চ্যান","Jackie Chan"],
["জন সিনা","John Cena"],["কিম কার্দাশিয়ান","Kim Kardashian"],["মালালা ইউসুফজাই","Malala Yousafzai"],
["পরীমনি","Pori Moni"],["হুমায়ূন আহমেদ","Humayun Ahmed"]
];

let celebrities=[],questions=[],currentIndex=0,score=0;
let coins=Number(localStorage.getItem("coins")||0);
let bestScore=Number(localStorage.getItem("bestScore")||0);
let timeLeft=15,timer=null,imageStage=0,answered=false;
let soundEnabled=localStorage.getItem("soundEnabled")!=="false";
let audioCtx=null;

const $=id=>document.getElementById(id);

function initAudio(){
    if(!soundEnabled)return;
    try{
        if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==="suspended")audioCtx.resume();
    }catch(e){}
}

function tone(freq,duration,type="sine",volume=.06,delay=0){
    if(!soundEnabled)return;
    initAudio();
    if(!audioCtx)return;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,audioCtx.currentTime+delay);
    gain.gain.linearRampToValueAtTime(volume,audioCtx.currentTime+delay+.01);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+duration+.02);
}

function playClick(){tone(520,.07,"sine",.045)}
function playCorrect(){tone(523,.12,"sine",.07);tone(659,.12,"sine",.07,.12);tone(784,.2,"sine",.08,.24)}
function playWrong(){tone(220,.16,"sawtooth",.055);tone(160,.22,"sawtooth",.05,.16)}
function playTick(){tone(700,.045,"square",.025)}
function playTimeUp(){tone(180,.18,"square",.06);tone(130,.3,"square",.05,.18)}
function playWin(){tone(523,.1,"sine",.06);tone(659,.1,"sine",.06,.1);tone(784,.1,"sine",.06,.2);tone(1047,.35,"sine",.08,.3)}

function toggleSound(){
    soundEnabled=!soundEnabled;
    localStorage.setItem("soundEnabled",soundEnabled);
    updateSoundButtons();
    if(soundEnabled){initAudio();playClick()}
}
function updateSoundButtons(){
    const text=soundEnabled?"🔊 Sound ON":"🔇 Sound OFF";
    if($("soundToggle"))$("soundToggle").textContent=text;
    if($("gameSoundToggle"))$("gameSoundToggle").textContent=text;
}

function shuffle(array){return [...array].sort(()=>Math.random()-.5)}

function setScreen(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    $(id).classList.add("active");
}

async function loadImages(){
    if(celebrities.length>0)return;
    $("loadingText").textContent="অনলাইন থেকে ছবিগুলো লোড হচ্ছে...";
    for(const person of people){
        try{
            const api="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles="+encodeURIComponent(person[1]);
            const response=await fetch(api);
            const data=await response.json();
            const pages=Object.values(data.query.pages);
            const page=pages[0];
            if(page&&page.thumbnail&&page.thumbnail.source){
                celebrities.push({name:person[0],image:page.thumbnail.source});
            }
        }catch(error){console.log("ছবি পাওয়া যায়নি:",person[0])}
    }
    $("loadingText").textContent=celebrities.length+" জন মানুষের ছবি প্রস্তুত হয়েছে।";
}

async function startGame(){
    initAudio();playClick();
    await loadImages();
    if(celebrities.length<4){
        playWrong();alert("ছবি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।");return;
    }
    questions=shuffle(celebrities).slice(0,10);
    currentIndex=0;score=0;
    $("gameScore").textContent=score;$("gameCoins").textContent=coins;
    setScreen("gameScreen");loadQuestion();
}

function loadQuestion(){
    clearInterval(timer);answered=false;imageStage=0;timeLeft=15;
    const person=questions[currentIndex];
    $("roundText").textContent="প্রশ্ন "+(currentIndex+1)+" / "+questions.length;
    $("timer").textContent=timeLeft;$("timer").style.background="#ef4444";
    $("questionTitle").textContent="এই মানুষটিকে চিনতে পারছেন?";
    $("imageLabel").textContent="প্রথমে চোখের অংশ দেখানো হচ্ছে";
    $("questionImage").src=person.image;
    $("questionImage").style.transform="scale(3)";
    $("questionImage").style.transformOrigin="50% 25%";
    $("questionImage").style.objectFit="cover";
    $("anotherPartBtn").disabled=false;$("anotherPartBtn").textContent="👁️ আরেকটি অঙ্গ দেখুন";
    $("revealBox").style.display="none";
    createAnswers(person);startTimer();
}

function createAnswers(correct){
    const wrongAnswers=shuffle(celebrities.filter(p=>p.name!==correct.name)).slice(0,3);
    const options=shuffle([correct,...wrongAnswers]);
    $("answers").innerHTML="";
    options.forEach(person=>{
        const button=document.createElement("button");
        button.className="answer-btn";button.textContent=person.name;
        button.onclick=()=>{playClick();checkAnswer(person.name,correct.name)};
        $("answers").appendChild(button);
    });
}

function startTimer(){
    timer=setInterval(()=>{
        timeLeft--;$("timer").textContent=timeLeft;
        if(timeLeft<=5&&timeLeft>0)playTick();
        if(timeLeft<=5)$("timer").style.background="#dc2626";
        if(timeLeft<=0){
            clearInterval(timer);playTimeUp();showAnswer(questions[currentIndex],false);
        }
    },1000);
}

function checkAnswer(selected,correct){
    if(answered)return;
    clearInterval(timer);answered=true;
    document.querySelectorAll(".answer-btn").forEach(b=>b.disabled=true);
    if(selected===correct){
        playCorrect();score+=10;coins+=5;localStorage.setItem("coins",coins);
        if(score>bestScore){bestScore=score;localStorage.setItem("bestScore",bestScore)}
        $("gameScore").textContent=score;$("gameCoins").textContent=coins;
    }else{playWrong()}
    showAnswer(questions[currentIndex],selected===correct);
}

function showAnswer(person,isCorrect){
    clearInterval(timer);answered=true;
    document.querySelectorAll(".answer-btn").forEach(b=>b.disabled=true);
    $("questionImage").style.transform="scale(1)";
    $("questionImage").style.transformOrigin="center";
    $("questionImage").style.objectFit="contain";
    $("imageLabel").textContent="সম্পূর্ণ ছবি";
    $("questionTitle").textContent=isCorrect?"সঠিক উত্তর! 🎉":"সঠিক উত্তর দেখুন";
    $("revealImage").src=person.image;$("revealName").textContent=person.name;
    $("revealBox").style.display="block";$("anotherPartBtn").disabled=true;
}

function showAnotherPart(){
    if(answered)return;playClick();imageStage++;
    const image=$("questionImage");
    if(imageStage===1){
        image.style.transform="scale(2.3)";image.style.transformOrigin="50% 50%";
        $("imageLabel").textContent="মুখের অংশ দেখানো হচ্ছে";
    }else if(imageStage===2){
        image.style.transform="scale(2.2)";image.style.transformOrigin="50% 80%";
        $("imageLabel").textContent="নিচের অংশ দেখানো হচ্ছে";
    }else{showFullImage()}
}

function showFullImage(){
    if(!answered)playClick();
    $("questionImage").style.transform="scale(1)";
    $("questionImage").style.transformOrigin="center";
    $("questionImage").style.objectFit="contain";
    $("imageLabel").textContent="সম্পূর্ণ ছবি দেখানো হচ্ছে";
}

function nextQuestion(){
    playClick();currentIndex++;
    if(currentIndex>=questions.length)showResult();else loadQuestion();
}

function showResult(){
    clearInterval(timer);playWin();
    $("finalScore").textContent=score;$("resultScore").textContent=score;
    $("resultCoins").textContent=coins;$("resultBest").textContent=bestScore;
    setScreen("resultScreen");
}

function goHome(){
    clearInterval(timer);playClick();
    $("homeCoins").textContent=coins;$("homeBest").textContent=bestScore;
    setScreen("homeScreen");
}

function showInstructions(){
    initAudio();playClick();
    alert("খেলার নিয়ম:\n\n১. প্রথমে চোখের অংশ দেখানো হবে।\n২. না চিনলে আরেকটি অঙ্গ দেখতে পারবেন।\n৩. সম্পূর্ণ ছবিও দেখতে পারবেন।\n৪. প্রতিটি প্রশ্নের সময় ১৫ সেকেন্ড।\n৫. সঠিক উত্তর দিলে ১০ পয়েন্ট ও ৫ কয়েন পাবেন।");
}

$("homeCoins").textContent=coins;
$("homeBest").textContent=bestScore;
updateSoundButtons();
</script>
</body>
</html>
